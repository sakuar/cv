name: Deploy to GitHub Pages

# 每次推送到 main 自动部署；也可在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'               # 纯静态站点，整个仓库根目录即可

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
