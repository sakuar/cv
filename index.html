<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 不希望被搜索引擎收录，作为“防止别人搜索”的第一道措施 -->
  <meta name="robots" content="noindex, nofollow" />
  <title>简历工坊 · Resume Studio</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/templates.css" />
</head>
<body>

  <!-- ============ 主应用 ============ -->
  <section id="app-view" class="app-view">
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-logo">✦ 简历工坊</span>
      </div>
      <div class="topbar-center">
        <div class="picker">
          <label>模板</label>
          <select id="template-select">
            <option value="minimal">简约专业</option>
            <option value="executive">商务精英</option>
            <option value="timeline">时间轴</option>
            <option value="banner">顶部色带</option>
            <option value="sidebar">经典侧栏</option>
            <option value="creative">创意色彩</option>
            <option value="tech">技术极客</option>
            <option value="magazine">杂志摆齐</option>
          </select>
        </div>
        <div class="picker">
          <label>皮肤</label>
          <div id="skin-swatches" class="swatches"></div>
        </div>
        <div class="picker">
          <label>字号</label>
          <input type="range" id="font-range" class="fs-range" min="0.8" max="1.3" step="0.05" value="1" />
          <span id="font-val" class="fs-val">100%</span>
        </div>
      </div>
      <div class="topbar-right">
        <button class="btn btn-ghost btn-icon" id="btn-theme" title="切换日间 / 夜间">🌙</button>
        <button class="btn btn-ghost" id="btn-focus">预览模式</button>
        <button class="btn btn-ghost" id="btn-share">分享链接</button>
        <button class="btn btn-ghost" id="btn-export-html">导出网页</button>
        <button class="btn btn-ghost" id="btn-reset">重置</button>
        <button class="btn btn-ghost" id="btn-import">导入</button>
        <button class="btn btn-ghost" id="btn-export">备份</button>
        <button class="btn btn-primary" id="btn-print">导出 PDF</button>
      </div>
    </header>

    <div class="workspace">
      <!-- 左侧：编辑器 -->
      <aside class="editor" id="editor"></aside>

      <!-- 可拖动分隔条（双击复位） -->
      <div class="splitter" id="splitter" title="拖动调整宽度 · 双击复位"></div>

      <!-- 右侧：实时预览 -->
      <main class="preview-wrap">
        <div class="zoom-sizer" id="zoom-sizer">
          <div id="resume-root" class="resume" data-template="minimal" data-skin="indigo"></div>
        </div>
      </main>
    </div>

    <input type="file" id="import-file" accept="application/json" hidden />

    <!-- 移动端：编辑 / 预览 单视图切换（仅窄屏显示） -->
    <button class="mobile-toggle" id="mobile-toggle">预览简历 →</button>

    <!-- 预览缩放条（浮于预览区右下角） -->
    <div class="zoom-bar" id="zoom-bar">
      <button class="zoom-btn" id="zoom-out" title="缩小">−</button>
      <button class="zoom-val" id="zoom-val" title="点击复位 100%">100%</button>
      <button class="zoom-btn" id="zoom-in" title="放大">+</button>
      <span class="zoom-sep"></span>
      <button class="zoom-fit" id="zoom-fit" title="适应预览宽度">适应</button>
    </div>
  </section>

  <!-- ============ 只读查看页（分享链接打开后显示） ============ -->
  <section id="viewer-view" class="viewer-view" hidden>
    <div class="viewer-bar">
      <span class="viewer-tip">📄 这是分享的简历（只读）</span>
      <div class="viewer-actions">
        <button class="btn btn-primary btn-tiny" id="viewer-print">下载 PDF</button>
        <a class="btn btn-ghost btn-tiny" id="viewer-make" href="./">制作我的简历 →</a>
      </div>
    </div>
    <div class="viewer-scroll">
      <div id="viewer-resume" class="resume"></div>
    </div>
  </section>

  <!-- 轻提示 -->
  <div id="toast" class="toast" hidden></div>

  <script src="js/store.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
